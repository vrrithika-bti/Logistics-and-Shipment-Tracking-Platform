services:

  postgres:
    image: postgres:17
    container_name: logistics-postgres

    environment:
      POSTGRES_DB: shipment_db
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d shipment_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:latest
    container_name: logistics-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs


  shipment-service:
    build:
      context: ../services/shipment-service

    container_name: shipment-service

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy


  tracking-service:
    build:
      context: ../services/tracking-service

    container_name: tracking-service

    ports:
      - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started


  location-ingestion-service:
    build:
      context: ../services/location-ingestion-service

    container_name: location-ingestion-service

    ports:
      - "8083:8083"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      kafka:
        condition: service_started


volumes:
  postgres_data: