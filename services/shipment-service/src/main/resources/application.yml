spring:

  application:
    name: shipment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shipment_db
    username: logistics
    password: logistics_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always