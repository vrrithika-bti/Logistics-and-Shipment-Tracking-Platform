spring:
  application:
    name: tracking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tracking_db}
    username: ${SPRING_DATASOURCE_USERNAME:logistics}
    password: ${SPRING_DATASOURCE_PASSWORD:logistics_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

    consumer:
      group-id: tracking-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.logistics.tracking.dto"
        spring.json.value.default.type: "com.logistics.tracking.dto.LocationUpdate"
        spring.json.use.type.headers: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info